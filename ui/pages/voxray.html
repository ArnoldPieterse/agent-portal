<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Voxel Ray View - AgentPortal</title>
<style>
html,body{margin:0;height:100%;background:#05070d;overflow:hidden;font-family:ui-monospace,Consolas,monospace}
#c{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:10px;left:12px;color:#9fd8ff;font-size:12px;line-height:1.5;text-shadow:0 1px 2px #000;pointer-events:none}
#hud b{color:#fff}
#bar{position:fixed;top:10px;right:12px;display:flex;gap:8px}
button{background:#101a30;color:#7fd4ff;border:1px solid #2a4a7a;border-radius:6px;padding:5px 10px;cursor:pointer;font-family:inherit;font-size:12px}
a{color:#7fd4ff}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><b>VOXEL RAY VIEW</b> - per-pixel raymarch of the memory voxel world<br>
idle... drag to orbit, wheel to zoom</div>
<div id="bar"><button id="bg">ghosts: on</button><a href="/ui/pages/mind.html" style="align-self:center">mind room &larr;</a></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const MAXC=512, MAXG=512;
const FRAG=`
precision highp float;
uniform vec2 uRes; uniform vec3 uCamPos; uniform mat3 uCamMat;
uniform int uNC; uniform vec4 uCell[${MAXC}];
uniform vec3 uCol[${MAXC}]; uniform float uType[${MAXC}]; uniform float uSeed[${MAXC}];
uniform int uNG; uniform vec4 uGhost[${MAXG}];
uniform float uTime; uniform float uShowGhosts;
float h3(vec3 p){p=fract(p*0.3183099+0.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vnoise(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 float a=h3(i),b=h3(i+vec3(1,0,0)),c=h3(i+vec3(0,1,0)),d=h3(i+vec3(1,1,0));
 float e=h3(i+vec3(0,0,1)),g2=h3(i+vec3(1,0,1)),k=h3(i+vec3(0,1,1)),l=h3(i+vec3(1,1,1));
 return mix(mix(mix(a,b,f.x),mix(c,d,f.x),f.y),mix(mix(e,g2,f.x),mix(k,l,f.x),f.y),f.z);}
float fbm(vec3 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*vnoise(p);p*=2.13;a*=.5;}return v;}
float iAABB(vec3 ro,vec3 rd,vec3 mn,vec3 mx){
 vec3 t0=(mn-ro)/rd,t1=(mx-ro)/rd;
 vec3 tmn=min(t0,t1),tmx=max(t0,t1);
 float tn=max(max(tmn.x,tmn.y),tmn.z),tf=min(min(tmx.x,tmx.y),tmx.z);
 return (tf>max(tn,0.))?tn:-1.;}
void main(){
 vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y;
 vec3 ro=uCamPos, rd=normalize(uCamMat*vec3(uv,-1.6)); // lookAt basis: +Z points back at eye
 float best=1e9; int bi=-1;
 for(int i=0;i<${MAXC};i++){ if(i>=uNC)break;
  vec4 C=uCell[i]; if(C.w<=0.)continue;
  float t=iAABB(ro,rd,C.xyz,C.xyz+C.w);
  if(t>0.&&t<best){best=t;bi=i;}}
 vec3 col;
 if(bi>=0){
  vec4 C=uCell[bi]; vec3 mn=C.xyz; float sz=C.w;
  vec3 p=ro+rd*best;
  vec3 loc=(p-mn)/sz; float sd=uSeed[bi];
  // heightmap detail: displace along face normal + perturb shading normal
  vec3 nrm=abs(rd); nrm/= (nrm.x+nrm.y+nrm.z);
  float amp=sz*0.10;
  float h=fbm(loc*6.+sd*7.3);
  p+=nrm*h*amp;
  float e=sz*0.02;
  float hx=fbm((loc+vec3(e,0,0))*6.+sd*7.3), hy=fbm((loc+vec3(0,e,0))*6.+sd*7.3);
  vec3 bn=nrm*(h-hx)/e*amp*2. - vec3(0.,0.,0.); // cheap slope hint
  vec3 N=normalize(mix(nrm, nrm+bn*0.4, step(0.5,h)));
  vec3 base=uCol[bi];
  float ty=uType[bi];
  if(ty<0.5){ // rigid: brushed metal + rim
   float st=sin(loc.y*46.+sd*9.)*.5+.5;
   base=mix(base,base*1.7,st*.25);
  } else {    // leaf: paper grid
   vec3 g=abs(fract(loc*8.)-.5);
   float ln=min(g.x,g.y); ln=min(ln,g.z);
   base=mix(base,base*0.55,smoothstep(.46,.5,ln)*.5);
  }
  vec3 L=normalize(vec3(.5,1.,.3));
  float dif=max(dot(N,L),0.); float spe=pow(max(dot(reflect(-L,N),-rd),0.),42.);
  float fr=pow(1.-max(dot(N,-rd),0.),3.);
  col=base*(.22+dif*.85)+vec3(1.,.95,.85)*spe*(ty<0.5?.8:.15)+uCol[bi]*fr*.6;
  col=mix(col,vec3(.02,.04,.08),smoothstep(24.,60.,best)); // fog (band widened for orbit distance)
 } else {
  col=vec3(.015,.03,.06)+vec3(.02,.05,.1)*uv.y;
  if(uShowGhosts>.5){ // future pathways: next subdivision level, faint additive
   float gb=1e9; vec4 GC=vec4(0.);
   for(int j=0;j<${MAXG};j++){ if(j>=uNG)break;
    vec4 G=uGhost[j]; if(G.w<=0.)continue;
    float t=iAABB(ro,rd,G.xyz,G.xyz+G.w);
    if(t>0.&&t<gb){gb=t;GC=G;}}
   if(gb<1e9){
    vec3 gp=ro+rd*gb; vec3 gl=(gp-GC.xyz)/GC.w;
    float pw=.5+.5*sin(uTime*2.+gl.x*9.+gl.y*7.+gl.z*5.);
    col+=vec3(.1,.6,1.)*pw*.28*(1.-smoothstep(0.,40.,gb));
   }
  }
 }
 gl_FragColor=vec4(col,1.);
}`;
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false});
const scene=new THREE.Scene(); const cam=new THREE.PerspectiveCamera(60,1,0.01,200);
const geo=new THREE.PlaneGeometry(2,2);
const uni={uRes:{value:new THREE.Vector2()},uCamPos:{value:new THREE.Vector3()},uCamMat:{value:new THREE.Matrix3()},
 uNC:{value:0},uCell:{value:Array.from({length:MAXC},()=>new THREE.Vector4(0,0,0,0))},
 uCol:{value:Array.from({length:MAXC},()=>new THREE.Vector3())},uType:{value:new Float32Array(MAXC)},uSeed:{value:new Float32Array(MAXC)},
 uNG:{value:0},uGhost:{value:Array.from({length:MAXG},()=>new THREE.Vector4(0,0,0,0))},
 uTime:{value:0},uShowGhosts:{value:1}};
const mat=new THREE.ShaderMaterial({fragmentShader:FRAG,vertexShader:'void main(){gl_Position=vec4(position.xy,0.,1.);}',uniforms:uni});
scene.add(new THREE.Mesh(geo,mat));
let yaw=0.0,pitch=.05,dist=26,tgt=new THREE.Vector3(0,0,0),showG=true; // head-on into the central object cluster (room is sparse off-axis)
function camUpdate(){const cp=Math.cos(pitch);
 uni.uCamPos.value.set(tgt.x+dist*cp*Math.sin(yaw),tgt.y+dist*Math.sin(pitch),tgt.z+dist*cp*Math.cos(yaw));
 const m=new THREE.Matrix4().lookAt(uni.uCamPos.value,tgt,new THREE.Vector3(0,1,0));
 uni.uCamMat.value.set(m.elements[0],m.elements[1],m.elements[2],m.elements[4],m.elements[5],m.elements[6],m.elements[8],m.elements[9],m.elements[10]);}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);uni.uRes.value.set(w*devicePixelRatio,h*devicePixelRatio);renderer.setPixelRatio(devicePixelRatio);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
let drag=null;
canvas.addEventListener('mousedown',e=>drag=[e.clientX,e.clientY]);
addEventListener('mouseup',()=>drag=null);
addEventListener('mousemove',e=>{if(!drag)return;yaw-=(e.clientX-drag[0])*.005;pitch=Math.max(-1.4,Math.min(1.4,pitch+(e.clientY-drag[1])*.005));drag=[e.clientX,e.clientY];});
canvas.addEventListener('wheel',e=>{dist=Math.max(3,Math.min(60,dist+e.deltaY*.02));},{passive:true});
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0)/4294967295;}
function hueCol(h,s,l){const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h*12)%12;return l-a*Math.max(-1,Math.min(k-3,Math.min(9-k,1)));};return [f(0),f(8),f(4)];}
let lastSig='';
function load(){
 if(document.hidden)return; // pause polling on hidden tabs
 Promise.all([fetch('/api/voxel/all').then(r=>r.json()),
              fetch('/api/voxel/pulse').then(r=>r.json()).catch(()=>null)]).then(([d,p])=>{
  const all=d.cells||[];
  const cells=all.filter(c=>c.l||c.r); // only voxels that actually hold memory
  let n=0;
  for(const c of cells){ if(n>=MAXC)break;
   const h=hash(c.a);
   uni.uCell.value[n].set(c.p[0],c.p[1],c.p[2],c.s);
   const col=(c.k==='rigid')?hueCol(.55+h*.1,.65,.5):hueCol(.12+h*.08,.35,.72);
   uni.uCol.value[n].set(col[0],col[1],col[2]);
   uni.uType.value[n]=(c.k==='rigid')?0:1;
   uni.uSeed.value[n]=h*100;
   n++; }
  uni.uNC.value=n;
  // ---- future pathways: where subdivision grows next ----
  const have=new Set(all.map(c=>c.a)); // materialized, incl. empty space cells
  let g=0; const put=(x,y,z,s)=>{ if(g<MAXG){uni.uGhost.value[g].set(x,y,z,s);g++;} };
  // a) drill tips still below the floor: their next focus octant (0/0/0)
  for(const c of cells){ if(c.d>=2&&c.d<11){ const s2=c.s/2;
   if(!have.has(c.a+'/0/0/0')) put(c.p[0],c.p[1],c.p[2],s2); } }
  // b) objects with materialized children: ghost their missing level-1 octants
  for(const c of all){ if(c.d!==0)continue;
   let any=false; const s2=c.s/2;
   for(let i=0;i<8;i++){const na=c.a+'/'+(i&1)+'/'+((i>>1)&1)+'/'+((i>>2)&1); if(have.has(na)){any=true;break;}}
   if(!any)continue;
   for(let i=0;i<8&&g<MAXG;i++){const x=i&1,y=(i>>1)&1,z=(i>>2)&1;
    const na=c.a+'/'+x+'/'+y+'/'+z; if(!have.has(na)) put(c.p[0]+x*s2,c.p[1]+y*s2,c.p[2]+z*s2,s2);}}
  // c) level-1 space cells under those objects: ghost missing level-2 octants
  for(const c of all){ if(c.d!==1)continue;
   const s2=c.s/2;
   for(let i=0;i<8&&g<MAXG;i++){const x=i&1,y=(i>>1)&1,z=(i>>2)&1;
    const na=c.a+'/'+x+'/'+y+'/'+z; if(!have.has(na)) put(c.p[0]+x*s2,c.p[1]+y*s2,c.p[2]+z*s2,s2);}}
  uni.uNG.value=g;
  const sig=d.n+':'+(cells[n-1]?cells[n-1].a:'')+':'+g; // cheap change detector
  const live=p&&p.running?'<span style="color:#5dff9d">\u25cf LIVE</span> tick '+p.tick:'<span style="opacity:.5">feed static</span>';
  document.getElementById('hud').innerHTML='<b>VOXEL RAY VIEW</b> - per-pixel raymarch of the memory voxel world<br>'+
   'solid voxels: <b>'+n+'</b> (of '+d.n+' materialized) \u00b7 future pathways: <b>'+g+'</b><br>'+
   'detail floor 1.46mm (depth 11) \u00b7 '+live+(sig!==lastSig?' \u00b7 <span style="color:#ffd76a">data updated</span>':'')+'<br>'+
   'drag orbit \u00b7 wheel zoom';
  lastSig=sig;
 }).catch(e=>{document.getElementById('hud').innerHTML='load error: '+e;});
}
load(); setInterval(load,2000); // subdivision data refreshes live (10ms pulse engine)
document.getElementById('bg').onclick=function(){showG=!showG;uni.uShowGhosts.value=showG?1:0;this.textContent='ghosts: '+(showG?'on':'off');};
let t0=performance.now(),frames=0,fpsT=t0;
(function loop(){requestAnimationFrame(loop);
 uni.uTime.value=(performance.now()-t0)/1000; camUpdate(); renderer.render(scene,cam);
 frames++; const now=performance.now(); if(now-fpsT>1000){fpsT=now;} })();
</script></body></html>
