    const dx=n.x-mx, dy=n.y-my;
    const r=Math.max(4,Math.sqrt(n.deg)*2);
    if(dx*dx+dy*dy < r*r && dx*dx+dy*dy<best) { best=dx*dx+dy*dy; hit=i; }
  });
  selected = (hit===selected) ? -1 : hit;
  updateInfo();
});

cv.addEventListener('mousemove', e=>{
  const [mx,my] = fromScreen(e.clientX, e.clientY);
  hoverNode=-1; let best=Infinity;
  nodes.forEach((n,i)=>{
    const dx=n.x-mx, dy=n.y-my;
    const r=Math.max(4,Math.sqrt(n.deg)*2);
    if(dx*dx+dy*dy < r*r && dx*dx+dy*dy<best) { best=dx*dx+dy*dy; hoverNode=i; }
  });
  cv.style.cursor = hoverNode>=0?'pointer':'default';
});

cv.addEventListener('wheel', e=>{
  e.preventDefault();
  const f = e.deltaY>0 ? 0.9 : 1.1;
  const [mx,my] = fromScreen(e.clientX, e.clientY);
  scale *= f;
  panX += mx - (e.clientX/scale);
  panY += my - (e.clientY/scale);
}, {passive:false});

let dragging=false, lastX=0, lastY=0;
cv.addEventListener('mousedown', e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; });
addEventListener('mouseup', ()=>dragging=false);
addEventListener('mousemove', e=>{
  if(!dragging) return;
  panX += (e.clientX-lastX)/scale;
  panY += (e.clientY-lastY)/scale;
  lastX=e.clientX; lastY=e.clientY;
});

function updateInfo() {
  const el = document.getElementById('info');
  if (selected<0) { el.style.display='none'; return; }
  el.style.display='block';
  document.getElementById('info-title').textContent = N[selected].label;
  document.getElementById('info-body').textContent = `Degree: ${N[selected].deg} | Dir: ${N[selected].dir}`;
  const conn = document.getElementById('info-conn');
  conn.innerHTML='<div style="color:#8b949e;margin-bottom:4px">Connections:</div>';
  adj[selected].forEach(j=>{
    conn.innerHTML += `<div>${N[j].label}</div>`;
  });
}

// Render loop
function draw() {
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(panX*scale, panY*scale);
  ctx.scale(scale,scale);

  // Edges
  const highlight = selected>=0;
  E.forEach(e=>{
    if (highlight && e.s!==selected && e.t!==selected) {
      ctx.strokeStyle='rgba(48,54,61,0.3)';
    } else if (searchQ.length>=2 && !matched.has(e.s) && !matched.has(e.t)) {
      ctx.strokeStyle='rgba(48,54,61,0.2)';
    } else {
      ctx.strokeStyle = highlight ? 'rgba(88,166,255,0.7)' : 'rgba(88,166,255,0.15)';
    }
    ctx.lineWidth = 0.5/scale;
    ctx.beginPath();
    ctx.moveTo(nodes[e.s].x, nodes[e.s].y);
    ctx.lineTo(nodes[e.t].x, nodes[e.t].y);
    ctx.stroke();
  });

  // Nodes
  nodes.forEach((n,i)=>{
    const r = Math.max(3, Math.sqrt(n.deg)*1.8);
    let alpha2 = 1;
    if (highlight && i!==selected && !adj[selected].has(i)) alpha2=0.15;
    if (searchQ.length>=2 && !matched.has(i)) alpha2=Math.min(alpha2,0.1);

    ctx.globalAlpha = alpha2;
    ctx.fillStyle = dirColor[n.dir]||'#8b949e';
    ctx.beginPath();
    ctx.arc(n.x, n.y, i===selected?r*1.5:r, 0, Math.PI*2);
    ctx.fill();

    // Label for high-degree or selected/hovered
    if (n.deg>=5 || i===selected || i===hoverNode || matched.has(i)) {
      ctx.globalAlpha = Math.min(1, alpha2+0.3);
      ctx.fillStyle='#c9d1d9';
      ctx.font=`${Math.max(9,12/scale)}px sans-serif`;
      ctx.fillText(n.label.split('/').pop(), n.x+r+3, n.y+4);
    }
  });
  ctx.globalAlpha=1;
  ctx.restore();
}

function loop() {
  simulate();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
