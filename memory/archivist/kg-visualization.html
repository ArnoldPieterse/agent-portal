const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
const infoDiv = document.getElementById('info');
const searchInput = document.getElementById('search');
const statsDiv = document.getElementById('stats');

let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

// Initialize node positions (circular layout)
const n = NODES.length;
NODES.forEach((node, i) => {
    const angle = (i / n) * Math.PI * 2;
    const r = 300 + Math.random() * 100;
    node.x = W/2 + r * Math.cos(angle);
    node.y = H/2 + r * Math.sin(angle);
    node.vx = 0; node.vy = 0;
    node.degree = (ADJ[node.id] || []).length;
    node.radius = Math.min(4 + node.degree * 0.5, 12);
});

const nodeMap = {};
NODES.forEach(node => { nodeMap[node.id] = node; });

// Force simulation
const REPULSION = 800;
const ATTRACTION = 0.005;
const CENTER_GRAVITY = 0.001;
const DAMPING = 0.9;
let alpha = 1.0;
let selectedNode = null;
let hoveredNode = null;
let filterText = '';

function simulate() {
    if (alpha < 0.001) return;
    alpha *= 0.995;
    
    for (let i = 0; i < n; i++) {
        const a = NODES[i];
        for (let j = i+1; j < n; j++) {
            const b = NODES[j];
            let dx = a.x - b.x, dy = a.y - b.y;
            let dist = Math.sqrt(dx*dx + dy*dy) || 1;
            if (dist > 300) continue;
            const force = REPULSION / (dist * dist);
            const fx = (dx / dist) * force * alpha;
            const fy = (dy / dist) * force * alpha;
            a.vx += fx; a.vy += fy;
            b.vx -= fx; b.vy -= fy;
        }
    }
    
    for (const e of EDGES) {
        const a = nodeMap[e.from], b = nodeMap[e.to];
        if (!a || !b) continue;
        let dx = b.x - a.x, dy = b.y - a.y;
        let dist = Math.sqrt(dx*dx + dy*dy) || 1;
        const force = (dist - 80) * ATTRACTION * alpha;
        const fx = (dx / dist) * force;
        const fy = (dy / dist) * force;
        a.vx += fx; a.vy += fy;
        b.vx -= fx; b.vy -= fy;
    }
    
    for (const node of NODES) {
        node.vx += (W/2 - node.x) * CENTER_GRAVITY * alpha;
        node.vy += (H/2 - node.y) * CENTER_GRAVITY * alpha;
        node.vx *= DAMPING;
        node.vy *= DAMPING;
        node.x += node.vx;
        node.y += node.vy;
    }
}

function getEdgeColor(kind) {
    if (kind === 'pointer') return '#7ec8e3';
    if (kind === 'supersession') return '#f4a261';
    return '#e76f51';
}

function matchesFilter(nodeId) {
    if (!filterText) return true;
    return nodeId.toLowerCase().includes(filterText);
}

function draw() {
    ctx.clearRect(0, 0, W, H);
    
    const connectedSet = new Set();
    if (selectedNode) {
        connectedSet.add(selectedNode.id);
        for (const e of (ADJ[selectedNode.id] || [])) connectedSet.add(e.to);
    }
    
    ctx.lineWidth = 1;
    for (const e of EDGES) {
        const a = nodeMap[e.from], b = nodeMap[e.to];
        if (!a || !b) continue;
        if (filterText && !matchesFilter(e.from) && !matchesFilter(e.to)) continue;
        
        let alpha_e = 0.3;
        if (selectedNode) {
            if (e.from === selectedNode.id || e.to === selectedNode.id) alpha_e = 0.9;
            else alpha_e = 0.05;
        }
        ctx.strokeStyle = getEdgeColor(e.kind);
        ctx.globalAlpha = alpha_e;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
    }
    ctx.globalAlpha = 1;
    
    for (const node of NODES) {
        if (filterText && !matchesFilter(node.id)) continue;
        
        let r = node.radius;
        let color = '#555';
        if (node === selectedNode) { color = '#fff'; r += 3; }
        else if (selectedNode && connectedSet.has(node.id)) { color = '#7ec8e3'; }
        else if (!filterText || matchesFilter(node.id)) { color = node.degree > 5 ? '#7ec8e3' : '#667'; }
        
        ctx.beginPath();
        ctx.arc(node.x, node.y, r, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        
        if (node.degree >= 4 || node === selectedNode || node === hoveredNode) {
            const label = node.id.length > 40 ? '...' + node.id.slice(-37) : node.id;
            ctx.font = '10px system-ui';
            ctx.fillStyle = '#ccc';
            ctx.fillText(label, node.x + r + 3, node.y + 3);
        }
    }
}

function findNode(mx, my) {
    let best = null, bestDist = Infinity;
    for (const node of NODES) {
        const dx = node.x - mx, dy = node.y - my;
        const d = dx*dx + dy*dy;
        if (d < (node.radius + 5) * (node.radius + 5) && d < bestDist) {
            best = node; bestDist = d;
        }
    }
    return best;
}

function showNodeInfo(node) {
    if (!node) { infoDiv.innerHTML = '<em>Click a node to inspect connections</em>'; return; }
    const edges = ADJ[node.id] || [];
    let html = '<div class="node-name">' + node.id + '</div>';
    html += '<div style="margin:4px 0;color:#888">Degree: ' + edges.length + '</div>';
    html += '<div style="max-height:300px;overflow-y:auto;">';
    for (const e of edges.slice(0, 50)) {
        const dir = e.to === node.id ? '&larr;' : '&rarr;';
        html += '<div class="edge-item">' + dir + ' ' + e.to + ' <span class="edge-kind">[' + e.kind + ']</span></div>';
    }
    if (edges.length > 50) html += '<div style="color:#888">... and ' + (edges.length - 50) + ' more</div>';
    html += '</div>';
    infoDiv.innerHTML = html;
}

let dragging = false, dragNode = null;
let lastMouse = {x: 0, y: 0};

canvas.addEventListener('mousedown', e => {
    const node = findNode(e.clientX, e.clientY);
    if (node) { dragNode = node; }
    dragging = true;
    lastMouse = {x: e.clientX, y: e.clientY};
});

canvas.addEventListener('mousemove', e => {
    const dx = e.clientX - lastMouse.x, dy = e.clientY - lastMouse.y;
    if (dragNode) {
        dragNode.x += dx; dragNode.y += dy;
        dragNode.vx = 0; dragNode.vy = 0;
        alpha = Math.max(alpha, 0.3);
    } else if (dragging) {
        for (const node of NODES) { node.x += dx; node.y += dy; }
    }
    lastMouse = {x: e.clientX, y: e.clientY};
    
    const hNode = findNode(e.clientX, e.clientY);
    if (hNode !== hoveredNode) {
        hoveredNode = hNode;
        if (hNode) {
            tooltip.style.display = 'block';
            tooltip.textContent = hNode.id;
            tooltip.style.left = (e.clientX + 10) + 'px';
            tooltip.style.top = (e.clientY - 20) + 'px';
        } else {
            tooltip.style.display = 'none';
        }
    }
});

canvas.addEventListener('mouseup', e => {
    if (!dragNode && !selectedNode) {
        const node = findNode(e.clientX, e.clientY);
        if (node) { selectedNode = node; showNodeInfo(node); alpha = Math.max(alpha, 0.1); }
        else { selectedNode = null; showNodeInfo(null); }
    }
    dragNode = null;
    dragging = false;
});

canvas.addEventListener('wheel', e => {
    const factor = e.deltaY > 0 ? 1.05 : 0.95;
    for (const node of NODES) {
        node.x = W/2 + (node.x - W/2) * factor;
        node.y = H/2 + (node.y - H/2) * factor;
    }
});

searchInput.addEventListener('input', e => {
    filterText = e.target.value.toLowerCase();
    if (filterText && NODES.length > 0) {
        const match = NODES.find(nd => nd.id.toLowerCase().includes(filterText));
        if (match) showNodeInfo(match);
    }
});

function loop() {
    simulate();
    draw();
    requestAnimationFrame(loop);
}

statsDiv.textContent = n + ' nodes | ' + EDGES.length + ' edges';
loop();
</script>
</body>
</html>
