<!doctype html><meta charset=utf-8><title>Designer goal3 - fleet goal bars (fixture)</title>
<style>:root{--ok:#3ddc84;--warn:#ff9f43;--err:#ff6b6b;--text:#e8edf4}
body{background:#0d1117;color:var(--text);font-family:ui-monospace,Consolas,monospace;padding:24px}
.frow{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13px}.hint{opacity:.6}
.goalbar{height:10px}</style>
<h3>Fleet - goal completion per agent (8 inline-SVG bars, SMIL-animated on load)</h3><div class=frow><b>Orchestrator</b> <span class=hint>10/10 goals</span> <svg class="goalbar" viewBox="0 0 140 10" width="140" height="10" role="img" aria-label="goals 100%"><rect x="0" y="2" width="140" height="6" rx="3" fill="rgba(128,140,155,.18)"/><rect class="gbar-fill" x="0" y="2" width="132.0" height="6" rx="3" style="fill:var(--ok)"><animate attributeName="width" from="0" to="132.0" dur="0.4s" fill="freeze"/></rect></svg></div>
<div class=frow><b>Researcher</b> <span class=hint>8/10 goals</span> <svg class="goalbar" viewBox="0 0 140 10" width="140" height="10" role="img" aria-label="goals 80%"><rect x="0" y="2" width="140" height="6" rx="3" fill="rgba(128,140,155,.18)"/><rect class="gbar-fill" x="0" y="2" width="105.6" height="6" rx="3" style="fill:var(--ok)"><animate attributeName="width" from="0" to="105.6" dur="0.4s" fill="freeze"/></rect></svg></div>
<div class=frow><b>Builder</b> <span class=hint>10/10 goals</span> <svg class="goalbar" viewBox="0 0 140 10" width="140" height="10" role="img" aria-label="goals 100%"><rect x="0" y="2" width="140" height="6" rx="3" fill="rgba(128,140,155,.18)"/><rect class="gbar-fill" x="0" y="2" width="132.0" height="6" rx="3" style="fill:var(--ok)"><animate attributeName="width" from="0" to="132.0" dur="0.4s" fill="freeze"/></rect></svg></div>
<div class=frow><b>Verifier</b> <span class=hint>9/10 goals</span> <svg class="goalbar" viewBox="0 0 140 10" width="140" height="10" role="img" aria-label="goals 90%"><rect x="0" y="2" width="140" height="6" rx="3" fill="rgba(128,140,155,.18)"/><rect class="gbar-fill" x="0" y="2" width="118.8" height="6" rx="3" style="fill:var(--ok)"><animate attributeName="width" from="0" to="118.8" dur="0.4s" fill="freeze"/></rect></svg></div>
<div class=frow><b>Designer</b> <span class=hint>2/10 goals</span> <svg class="goalbar" viewBox="0 0 140 10" width="140" height="10" role="img" aria-label="goals 20%"><rect x="0" y="2" width="140" height="6" rx="3" fill="rgba(128,140,155,.18)"/><rect class="gbar-fill" x="0" y="2" width="26.4" height="6" rx="3" style="fill:var(--err)"><animate attributeName="width" from="0" to="26.4" dur="0.4s" fill="freeze"/></rect></svg></div>
<div class=frow><b>Archivist</b> <span class=hint>5/10 goals</span> <svg class="goalbar" viewBox="0 0 140 10" width="140" height="10" role="img" aria-label="goals 50%"><rect x="0" y="2" width="140" height="6" rx="3" fill="rgba(128,140,155,.18)"/><rect class="gbar-fill" x="0" y="2" width="66.0" height="6" rx="3" style="fill:var(--warn)"><animate attributeName="width" from="0" to="66.0" dur="0.4s" fill="freeze"/></rect></svg></div>
<div class=frow><b>Scribe</b> <span class=hint>7/10 goals</span> <svg class="goalbar" viewBox="0 0 140 10" width="140" height="10" role="img" aria-label="goals 70%"><rect x="0" y="2" width="140" height="6" rx="3" fill="rgba(128,140,155,.18)"/><rect class="gbar-fill" x="0" y="2" width="92.4" height="6" rx="3" style="fill:var(--warn)"><animate attributeName="width" from="0" to="92.4" dur="0.4s" fill="freeze"/></rect></svg></div>
<div class=frow><b>Mechanic</b> <span class=hint>6/10 goals</span> <svg class="goalbar" viewBox="0 0 140 10" width="140" height="10" role="img" aria-label="goals 60%"><rect x="0" y="2" width="140" height="6" rx="3" fill="rgba(128,140,155,.18)"/><rect class="gbar-fill" x="0" y="2" width="79.2" height="6" rx="3" style="fill:var(--warn)"><animate attributeName="width" from="0" to="79.2" dur="0.4s" fill="freeze"/></rect></svg></div>
